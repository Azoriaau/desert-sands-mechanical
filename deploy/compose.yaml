# Deployment stack for the TrueNAS host.
# Watchtower polls GHCR every 60s and redeploys when :latest moves
# (i.e. on every push to main, once the Build container workflow finishes).
services:
  website:
    image: ghcr.io/azoriaau/desert-sands-mechanical:latest
    container_name: dsm-website
    restart: unless-stopped
    ports:
      - "3001:3000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    container_name: website-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - --label-enable
      - --interval
      - "60"
      - --cleanup
